<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#030409; --gold:#e2c074; --gold2:#c9a456;
    --white:#fff; --body:rgba(255,255,255,.80); --muted:rgba(255,255,255,.46);
    --line:rgba(226,192,116,.20);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1584px;height:396px;overflow:hidden}
  body{
    background:var(--black); color:var(--body);
    font-family:'DM Sans',sans-serif;
    background-image:
      radial-gradient(720px 460px at 100% 0%, rgba(226,192,116,.16), transparent 60%),
      radial-gradient(560px 360px at 6% 110%, rgba(94,234,212,.06), transparent 55%);
    position:relative;
  }
  /* textura de ruido */
  .noise{position:absolute;inset:0;opacity:.04;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
  /* "2026" gigante fantasma à direita */
  .ghost{position:absolute;right:-30px;top:50%;transform:translateY(-50%);
    font-family:'Sora',sans-serif;font-weight:800;font-size:300px;line-height:1;
    color:rgba(226,192,116,.05);letter-spacing:-.04em;user-select:none}
  .frame{position:absolute;inset:0;border:1px solid var(--line);margin:18px;border-radius:20px;pointer-events:none}

  .stage{position:relative;height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:0 88px;z-index:2;max-width:1180px}

  /* topo: logo */
  .brandrow{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .mark{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;letter-spacing:.06em;
    color:var(--black);background:linear-gradient(135deg,var(--gold),var(--gold2));
    padding:9px 16px;border-radius:11px}
  .brandtxt{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  /* kicker */
  .kicker{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
    display:inline-flex;align-items:center;gap:14px;margin-bottom:16px}
  .kicker::before{content:"";width:34px;height:2px;background:var(--gold)}

  /* titulo */
  h1{font-family:'Sora',sans-serif;font-weight:800;font-size:58px;line-height:1.04;
    letter-spacing:-.025em;color:var(--white)}
  h1 .g{background:linear-gradient(135deg,var(--gold),#f5dea3,var(--gold2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  /* rodape do banner */
  .foot{display:flex;align-items:center;gap:18px;margin-top:26px}
  .foot .chip{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13px;
    letter-spacing:.06em;color:var(--body);background:rgba(255,255,255,.04);
    border:1px solid var(--line);padding:8px 15px;border-radius:999px}
  .foot .chip b{color:var(--gold);font-weight:700}
  .foot .oab{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13px;
    letter-spacing:.1em;color:var(--muted)}
</style>
</head>
<body>
  <div class="noise"></div>
  <div class="ghost">2026</div>
  <div class="frame"></div>
  <div class="stage">
    <div class="brandrow">
      <span class="mark">AFAA</span>
      <span class="brandtxt">Alex Farias &amp; Advogados Associados</span>
    </div>
    <span class="kicker">Transporte Rodoviário de Cargas · Regulação 2026</span>
    <h1>Seguro de transporte de cargas:<br><span class="g">a virada de chave da ANTT.</span></h1>
    <div class="foot">
      <span class="chip"><b>3</b> seguros obrigatórios</span>
      <span class="chip">Ramo <b>0659</b></span>
      <span class="chip">Fiscalização <b>01/07</b></span>
      <span class="oab">OAB/SP 381.442 · Atendimento Nacional</span>
    </div>
  </div>
</body>
</html>
