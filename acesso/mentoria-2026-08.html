const f = document.getElementById('f'), pw = document.getElementById('p'),
      er = document.getElementById('e'), bt = document.getElementById('b');

f.addEventListener('submit', async ev => {
  ev.preventDefault();
  er.textContent = ''; bt.disabled = true; bt.textContent = 'Abrindo...';
  try {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:d(VAULT.s), iterations:VAULT.n, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:d(VAULT.i)}, key, d(VAULT.c));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (_) {
    er.textContent = 'Senha incorreta.';
    bt.disabled = false; bt.textContent = 'Abrir';
    pw.value = ''; pw.focus();
  }
});
