<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d14;color:#e9edf4;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:24px;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.box{width:100%;max-width:400px;text-align:center}
.ico{width:52px;height:52px;margin:0 auto 22px;border-radius:14px;
  background:rgba(240,160,75,.12);border:1px solid #7a5426;
  display:flex;align-items:center;justify-content:center;font-size:23px}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
p.s{color:#96a2b8;font-size:14px;line-height:1.6;margin-bottom:26px}
form{display:flex;flex-direction:column;gap:10px}
input{background:#121722;border:1px solid #242c3c;border-radius:9px;padding:13px 15px;
  color:#e9edf4;font-size:15px;font-family:inherit;text-align:center;letter-spacing:.04em}
input:focus{outline:none;border-color:#f0a04b}
button{background:#f0a04b;color:#0a0d14;border:0;border-radius:9px;padding:13px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s}
button:hover{background:#f5b268}
button:disabled{opacity:.55;cursor:default}
.err{color:#fb7185;font-size:13.5px;min-height:20px;margin-top:4px}
.ft{margin-top:30px;color:#5b6577;font-size:11.5px;line-height:1.65}
</style>

<body>
<div class="box">
  <div class="ico">&#128274;</div>
  <h1>Documento protegido</h1>
  <p class="s">Mentoria empresarial &middot; conte&uacute;do reservado.<br>Informe a senha de acesso.</p>
  <form id="f" autocomplete="off">
    <input id="p" type="password" placeholder="senha" autocomplete="off" autofocus>
    <button id="b" type="submit">Abrir</button>
    <div class="err" id="e"></div>
  </form>
  <p class="ft">Conte&uacute;do cifrado em AES-GCM com deriva&ccedil;&atilde;o PBKDF2-SHA256.<br>
  A senha n&atilde;o trafega e n&atilde;o fica armazenada em lugar nenhum.</p>

const f = document.getElementById('f'), pw = document.getElementById('p'),
      er = document.getElementById('e'), bt = document.getElementById('b');

f.addEventListener('submit', async ev => {
  ev.preventDefault();
  er.textContent = ''; bt.disabled = true; bt.textContent = 'Abrindo...';
  try {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:d(VAULT.s), iterations:VAULT.n, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:d(VAULT.i)}, key, d(VAULT.c));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (_) {
    er.textContent = 'Senha incorreta.';
    bt.disabled = false; bt.textContent = 'Abrir';
    pw.value = ''; pw.focus();
  }
