<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Acesso restrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#030409;--surface:#1a1c24;--ink:#fff;--muted:rgba(255,255,255,.7);--faint:rgba(255,255,255,.42);
    --line:rgba(226,192,116,.2);--accent:#e2c074;--accent-dim:#c9a456;--on-accent:#030409;--err:#fdba74}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:'DM Sans',sans-serif;padding:24px;
    background-image:radial-gradient(700px 480px at 80% -10%,rgba(226,192,116,.10),transparent 60%)}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
    border-radius:20px;padding:38px 32px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .lock{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;margin:0 auto 18px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--on-accent);font-size:1.6rem}
  .kick{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:'Sora',sans-serif;font-weight:700;font-size:1.5rem;margin:8px 0 6px;letter-spacing:-.02em}
  p.sub{color:var(--muted);font-size:.92rem;margin-bottom:22px}
  input{width:100%;background:#0f1117;border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font-family:inherit;font-size:1rem;padding:14px 16px;text-align:center;letter-spacing:.05em;transition:.2s}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:12px;background:var(--accent);color:var(--on-accent);border:none;border-radius:12px;
    font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;padding:14px;cursor:pointer;transition:.2s}
  button:hover{filter:brightness(1.06)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--err);font-size:.85rem;margin-top:14px;min-height:1em;font-family:'JetBrains Mono',monospace}
  .foot{color:var(--faint);font-size:.7rem;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="off">
    <div class="lock">&#128274;</div>
    <div class="kick">Documento confidencial</div>
    <h1>Acesso restrito</h1>
    <p class="sub">Digite a senha fornecida pelo escritório para visualizar o material do seu caso.</p>
    <input id="pw" type="password" placeholder="senha de acesso" autofocus aria-label="senha">
    <button id="b" type="submit">Abrir documento</button>
    <div class="err" id="e"></div>
    <div class="foot">Alex Farias &amp; Advogados &middot; OAB/SP 381.442<br>Conteúdo protegido &middot; sigilo profissional e LGPD</div>
  </form>
