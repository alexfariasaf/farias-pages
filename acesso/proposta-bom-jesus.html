const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(VAULT.salt), iterations:VAULT.iter, hash:"SHA-256"},
    keyMat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(VAULT.iv)}, key, b64(VAULT.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  try{
    const html = await open(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  }catch(_){ err.textContent = "Senha incorreta. Tente novamente."; }
});
